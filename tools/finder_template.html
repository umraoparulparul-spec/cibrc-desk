<title>CIB&amp;RC Registration Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<style>
/* Layout: sticky ask/search band on top; contents rail left, answers + page hits right; one column on phones */
:root{
  --bg:#f5f7f4; --panel:#ffffff; --ink:#1b2420; --muted:#5a6862; --line:#dde3de;
  --accent:#1f6f4a; --accent-ink:#ffffff; --accent-soft:#e2f0e8; --mark:#ffe58a; --must:#fbd9d0; --chip:#edf2ee; --warn:#8a5a00;
  --f-display:"Source Serif 4",Georgia,serif; --f-body:"Public Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111613; --panel:#19201c; --ink:#e4ebe7; --muted:#97a69f; --line:#2b3530;
    --accent:#5cc392; --accent-ink:#0c1a12; --accent-soft:#1d3127; --mark:#6b5a12; --must:#5a2a20; --chip:#222b26; --warn:#e7b65a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111613; --panel:#19201c; --ink:#e4ebe7; --muted:#97a69f; --line:#2b3530;
  --accent:#5cc392; --accent-ink:#0c1a12; --accent-soft:#1d3127; --mark:#6b5a12; --must:#5a2a20; --chip:#222b26; --warn:#e7b65a; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding-block:12px}
h1{font:600 19px/1.2 var(--f-display);margin:0 0 10px;text-wrap:balance}
h1 span{font:400 13px var(--f-body);color:var(--muted);margin-left:6px}
.tabs{display:flex;gap:4px;margin-bottom:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;flex:none}
.tab{font:600 13px var(--f-body);letter-spacing:.03em;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:5px 14px;border-radius:99px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row{display:flex;gap:8px}
#q,#ask{flex:1;min-width:0;font:17px var(--f-body);padding:11px 13px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);outline:none}
#ask{resize:vertical;min-height:48px;max-height:160px}
#q:focus,#ask:focus{border-color:var(--accent)}
.go{font:600 15px var(--f-body);background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:0 18px;cursor:pointer}
.go:disabled{opacity:.5;cursor:default}
.go.stop{background:var(--chip);color:var(--ink);border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:99px;padding:3px 11px;font:13px var(--f-body);cursor:pointer}
.chip:hover,.chip:focus-visible{border-color:var(--accent);color:var(--accent)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;padding-block:16px}
aside{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;max-height:calc(100vh - 210px);overflow:auto;position:sticky;top:200px}
.lbl{font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:4px 0 8px}
.trow{display:flex;gap:6px;justify-content:space-between;align-items:baseline;border-radius:6px;font-size:13.5px}
.trow:hover,.trow.on{background:var(--accent-soft)}
.tlink{all:unset;cursor:pointer;flex:1;padding:3px 6px;color:var(--ink);line-height:1.4}
.tlink:focus-visible{outline:2px solid var(--accent)}
.trow a{color:var(--muted);white-space:nowrap;font-size:12px;font-variant-numeric:tabular-nums;text-decoration:none;padding:3px 6px}
.trow a:hover{color:var(--accent);text-decoration:underline}
.toc .l1{font-weight:600;margin-top:8px}
.toc .l2{padding-left:16px}
.toc .l3{padding-left:30px;font-size:12.5px}
#tocFilter{width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-bottom:6px;font:13px var(--f-body)}
.meta{color:var(--muted);font-size:13px;margin-bottom:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;min-width:0}
.top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pg{font-weight:700;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.sec{color:var(--muted);font-size:12.5px;min-width:0}
.snip{margin:6px 0 4px;overflow-wrap:anywhere}
mark{background:var(--mark);color:inherit;padding:0 1px;border-radius:2px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.btn{font:13px var(--f-body);padding:4px 10px;border-radius:7px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.full{margin-top:8px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--bg);border-radius:6px;font-size:14px;max-height:460px;overflow:auto;overflow-wrap:anywhere}
.empty{color:var(--muted);padding:24px 4px;max-width:65ch}
.gloss{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
.gloss b{color:var(--accent)}
/* Q&A */
.qa{display:flex;flex-direction:column;gap:12px}
.turn-q{font:600 16px var(--f-body);color:var(--ink)}
.answer{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;max-width:80ch;overflow-wrap:anywhere}
.answer p{margin:0 0 8px}
.answer ul{margin:4px 0 8px;padding-left:20px}
.answer li{margin:2px 0}
.answer a.cite{display:inline-block;font:600 12px var(--f-body);font-variant-numeric:tabular-nums;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:0 5px;text-decoration:none;margin:0 1px}
.answer a.cite:hover{text-decoration:underline}
.status{color:var(--muted);font-size:13px;font-style:italic}
.srcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.note{font-size:13px;color:var(--warn)}
.disclaim{font-size:12px;color:var(--muted);margin-top:4px}
/* Header links + updates */
.toprow{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin-bottom:10px}
.toprow h1{margin:0}
.olinks{display:flex;flex-wrap:wrap;gap:6px}
.olinks a{font:600 13px var(--f-body);text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:4px 10px;background:var(--panel)}
.olinks a:hover{border-color:var(--accent);color:var(--accent)}
.olinks a.crop{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:99px;background:var(--must);color:var(--ink);font-size:11px;line-height:18px;text-align:center}
.ulist{display:flex;flex-direction:column;gap:8px;max-width:90ch}
.uitem{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:baseline}
.uitem .d{font:600 13px var(--f-body);font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.uitem .t{overflow-wrap:anywhere}
.pill{display:inline-block;font:600 11px var(--f-body);letter-spacing:.04em;text-transform:uppercase;border-radius:5px;padding:1px 6px;margin-right:6px;background:var(--chip);color:var(--muted)}
.pill.Gazette{background:var(--must);color:var(--ink)}
.pill.RCminutes{background:var(--accent-soft);color:var(--accent)}
.pill.Guideline{background:var(--mark);color:var(--ink)}
.pill.new{background:var(--accent);color:var(--accent-ink)}
@media (max-width:560px){.uitem{grid-template-columns:1fr}}
/* Home dashboard */
.hero{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 22px 18px;display:flex;flex-direction:column;gap:12px}
.hero h2{font:600 clamp(22px,3.2vw,30px)/1.2 var(--f-display);margin:0;text-wrap:balance}
.hero .row{max-width:820px}
#homeQ{flex:1;min-width:0;font:17px var(--f-body);padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);outline:none}
#homeQ:focus{border-color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.tile{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;color:var(--ink);font:inherit;position:relative;transition:border-color .15s,transform .15s}
.tile:hover,.tile:focus-visible{border-color:var(--accent);transform:translateY(-2px)}
.tile .ibox{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.tile b{font-size:15.5px}
.tile small{color:var(--muted);font-size:13px;line-height:1.4}
.tile .badge{position:absolute;top:12px;right:12px;margin:0}
.homecols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;margin-top:14px}
.hcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.hcard .hhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.hcard .hhead b{font:600 16px var(--f-display)}
.nrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:9px 0;border-top:1px solid var(--line)}
.nrow .t{overflow-wrap:anywhere;font-size:14px}
.nrow .d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.nrow .btn{align-self:start;grid-row:span 2}
.crow{display:flex;flex-direction:column;gap:5px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:var(--ink);font:inherit;width:100%}
.crow:hover b{color:var(--accent)}
.crow .progress{height:6px;max-width:none}
.glance{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px}
.glance b{color:var(--accent);white-space:nowrap}
.ico.sm{margin:0}
@media (max-width:820px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.homecols{grid-template-columns:1fr}}
@media (max-width:380px){.tile{padding:12px}.tile small{display:none}}
/* Checklist wizard */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;max-width:900px}
.opts.one{grid-template-columns:1fr;max-width:760px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;color:var(--ink);font:inherit;transition:border-color .15s,transform .15s}
.opt:hover,.opt:focus-visible{border-color:var(--accent);transform:translateY(-1px)}
.opt b{display:block;font-size:15px}
.opt small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.ico{flex:none;color:var(--accent);margin-top:1px}
.tag{flex:none;font:700 13px var(--f-body);background:var(--accent-soft);color:var(--accent);border-radius:7px;padding:3px 8px;min-width:52px;text-align:center}
.wz-crumbs{font-size:13px;color:var(--muted);margin-bottom:10px}
.linkbtn{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline}
.progress{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;max-width:520px}
.progress span{display:block;height:100%;background:var(--accent);transition:width .3s}
#wzName{padding:5px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:14px var(--f-body);min-width:0;width:220px;max-width:100%}
.grp{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;max-width:900px}
.grp summary{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;padding:11px 14px;cursor:pointer;font-size:15px}
.items{padding:0 8px 6px}
.item{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;gap:6px 10px;align-items:baseline;padding:7px 6px;border-top:1px solid var(--line);cursor:pointer}
.item.nr{opacity:.6;cursor:default}
.item input{margin:0;width:16px;height:16px;accent-color:var(--accent)}
.itx{overflow-wrap:anywhere}
.num{color:var(--muted);font-variant-numeric:tabular-nums}
.stc{font:600 11px var(--f-body);letter-spacing:.03em;border-radius:5px;padding:1px 6px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.stc.cond{background:var(--mark);color:var(--ink)}
.stc.nrc{background:var(--chip);color:var(--muted)}
.pgl{font-size:12px;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.gnotes{border-top:1px dashed var(--line);padding:8px 14px 10px;font-size:13px;color:var(--muted)}
.gnotes p{margin:0 0 5px}
.wznotes{width:100%;max-width:900px;min-height:80px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:14px var(--f-body)}
.prog{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;align-self:center}
@media (max-width:560px){.item{grid-template-columns:22px minmax(0,1fr)}.item .stc,.item .pgl{grid-column:2}}
/* Section reader */
.rhead{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.eyebrow{font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.rhead h2{font:600 24px/1.25 var(--f-display);margin:0;text-wrap:balance}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.kp{margin-bottom:14px;scroll-margin-top:200px}
p.kp-src,.rpage{scroll-margin-top:200px}
.kp .lbl{margin:0 0 6px}
.kpc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;max-width:86ch;display:flex;flex-direction:column;gap:10px}
.kp-load{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:14px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.kp-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 16px;align-items:flex-start}
.kp-top > div:first-child{flex:1 1 380px;min-width:0}
.kp-one{font:600 18px/1.4 var(--f-display);margin:6px 0 8px;text-wrap:pretty}
.kp-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.kp-chips .pill{text-transform:none;letter-spacing:0;font-size:12.5px;background:var(--accent-soft);color:var(--accent)}
.kp-h{font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-top:4px}
.kp-must{background:var(--must);border-radius:12px;padding:10px 14px}
.kp-must .kp-h{color:var(--ink);margin:0 0 4px}
.kpc ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.kpi{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start}
.kpi.must .kp-tx{font-weight:600}
.kp-ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-top:2px}
.kp-ic.warn{background:var(--ink);color:var(--panel);font:700 12px var(--f-body)}
.kp-tx{overflow-wrap:anywhere;line-height:1.5}
.kp-meta{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.kp-nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kp-num{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kp-num:hover{border-color:var(--accent)}
.kp-num b{font:600 20px/1.2 var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums}
.kp-num span{font-size:13px;line-height:1.35}
.kp-num small{font-size:11.5px;color:var(--muted)}
p.kp-src{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:4px;padding:4px 8px 4px 10px;margin-left:-13px;position:relative}
p.kp-src.li{padding-left:32px}
p.kp-src-must{background:var(--must);border-left-color:var(--ink)}
p.kp-src::after{content:"Key point " attr(data-kpn);display:block;font:600 10.5px var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-indent:0;margin-top:2px}
.kp-flash{animation:kpflash 1.6s ease-out}
@keyframes kpflash{0%,30%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.spin,.kp-flash{animation:none}}
.rpage{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 18px 14px;margin-bottom:10px;max-width:86ch}
.rpg{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);border-bottom:1px dashed var(--line);padding-bottom:6px;margin-bottom:8px;font-variant-numeric:tabular-nums}
.rpg a{color:var(--accent)}
.rp{margin:0 0 7px;overflow-wrap:anywhere}
.rp.li{padding-left:22px;text-indent:-14px}
.rp.h{font-weight:700;margin-top:10px}
.hl-must{background:var(--must);border-radius:3px;padding:0 2px;font-weight:600}
.hl-num{background:var(--mark);border-radius:3px;padding:0 2px;font-weight:600}
.hl-ref{color:var(--accent);font-weight:600;border-bottom:1px dotted var(--accent)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px}
/* PDF viewer */
.viewer{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.vbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-block:10px;background:var(--panel);border-bottom:1px solid var(--line)}
.vbar .sec{flex:1 1 220px;font-size:13px}
.vbar input{width:64px;padding:4px 6px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:14px var(--f-body);font-variant-numeric:tabular-nums}
.vbody{flex:1;overflow:auto;padding:16px;display:flex;justify-content:center;align-items:flex-start}
.vbody canvas{background:#fff;box-shadow:0 1px 8px rgba(0,0,0,.18);max-width:none}
.vmsg{color:var(--muted);padding:40px 0;text-align:center}
@media (max-width:820px){
  main{grid-template-columns:1fr}
  aside{position:static;max-height:340px;order:2}
  header{position:static}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

  <div class="toprow">
    <h1>CIB&amp;RC Registration Desk <span>472 RC Guidelines for the Registration of Pesticides · 727 pages</span></h1>

    </nav>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" id="tabHome" role="tab" aria-selected="true">Home</button>
    <button class="tab" id="tabAsk" role="tab" aria-selected="false">Ask a question</button>

      <textarea id="ask" rows="1" placeholder="e.g. What documents are needed to change the company name on a registration certificate?"></textarea>

  </div>

    <div class="row"><input id="q" type="search" placeholder='Type words… e.g.  shelf life 9(4)   ·   "free sale certificate"'></div>

  </div>
</div></header>

<main class="wrap gut">
  <aside>
    <div class="lbl">Contents · click a title to read it here</div>
    <input id="tocFilter" placeholder="Filter contents…">

</main>

<div class="viewer" id="viewer" hidden>

    <button class="btn" id="vClose">✕ Close</button>

    <button class="btn" id="vIn" aria-label="Zoom in">+</button>

    <div class="sec" id="vSec"></div>
  </div>
  <div class="vbody" id="vBody"></div>
</div>

<script>
const DATA = /*__DATA__*/null;
const $ = s => document.querySelector(s);
const pdfLink = p => `${DATA.pdfUrl}#page=${p}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const LOW = DATA.pages.map(t => t.replace(/\n/g, " ").toLowerCase());
const SECLOW = DATA.sec.map(t => t.toLowerCase());
const NP = DATA.pages.length;

const QUICK = ["shelf life","9(4)","9(3b) extension","change of name of company","transfer of registration",
  "additional source of import","free sale certificate","duplicate certificate","RTT import","export",
  "new packaging","factory address","combination product","seed treatment","biopesticide","household",
  "biocide","drone","MRL","five folders","KYC CROP","infrastructure","affidavit","label expansion"];
const ASKS = ["What is needed to change the company name on a registration certificate?",
  "How do I get a Free Sale Certificate?",
  "Requirements to extend provisional registration under 9(3B)?",
  "How to import a small sample quantity for RTT?",
  "What are the rules for drone spraying of pesticides?",
  "What goes in the five folders for a 9(3) application?"];
const GLOSS = [["TI","Technical Import"],["TIM","Technical Indigenous Manufacture"],["FI","Formulation Import"],
  ["FIM","Formulation Indigenous Manufacture"],["FIT","Formulation Indigenous (from Technical import)"],
  ["WRT","Without Registering Technical"],["MUP","Manufacture Use Product"],["RTT","Research, Test & Trial"],
  ["9(3B)","Provisional registration"],["9(3)","Regular registration"],["9(4)","Subsequent (me-too) registration"],
  ["CROP","Comprehensive Registration of Pesticides portal"],["PDSO","Petroleum Derived Spray Oil"],
  ["MRL","Maximum Residue Limit"],["a.i.","Active ingredient"],["RC","Registration Committee"]];

function count(hay, needle){ let n = 0, i = 0; while ((i = hay.indexOf(needle, i)) !== -1){ n++; i += needle.length; } return n; }
const STOP = new Set("the of for a an and in to u/s under is are what which who how do does i we my our can need needed required requirement requirements about on with by from be it this that any or as at me please tell give list get".split(" "));

// ---------- exact search (all words must appear) ----------
function parse(q){
  const terms = [];
  q.replace(/"([^"]+)"|(\S+)/g, (_, ph, w) => { const t = (ph || w).toLowerCase().trim(); if (t) terms.push(t); });
  const kept = terms.filter(t => !STOP.has(t));
  return kept.length ? kept : terms;
}
function search(q){
  const terms = parse(q);
  if (!terms.length) return null;
  const out = [];
  for (let i = 0; i < NP; i++){
    let score = 0, all = true;
    for (const t of terms){
      const c = count(LOW[i], t), s = count(SECLOW[i], t);
      if (!c && !s){ all = false; break; }
      score += Math.min(c, 8) + s * 6;
    }
    if (!all) continue;
    if (terms.length > 1 && LOW[i].includes(terms.join(" "))) score += 15;
    const head = LOW[i].slice(0, 250);
    for (const t of terms) if (head.includes(t)) score += 4;
    out.push({p: i + 1, score});
  }
  out.sort((a, b) => b.score - a.score || a.p - b.p);
  return {terms, out};
}

// ---------- loose ranking for questions (any word, rare words weigh more) ----------
function qWords(text){
  return [...new Set(text.toLowerCase().replace(/[“”"?,;:!]/g, " ").split(/\s+/).map(w => w.replace(/^\.+|\.+$/g, "")).filter(w => w.length > 1 && !STOP.has(w)))];
}
function rank(text, n){
  const words = qWords(text);
  const df = words.map(w => LOW.reduce((a, t) => a + (t.includes(w) ? 1 : 0), 0));
  const scores = [];
  for (let i = 0; i < NP; i++){
    let s = 0, hit = 0;
    words.forEach((w, k) => {
      if (!df[k]) return;
      const idf = Math.log(1 + NP / df[k]);
      const c = count(LOW[i], w), h = count(SECLOW[i], w);
      if (c || h) hit++;
      s += idf * (Math.min(c, 6) + h * 4);
    });
    if (s) scores.push({p: i + 1, s: s * (1 + hit / Math.max(1, words.length))});
  }
  return scores.sort((a, b) => b.s - a.s).slice(0, n).map(x => x.p);
}

function highlight(text, terms){
  const h = esc(text);
  if (!terms.length) return h;
  const re = new RegExp("(" + terms.map(t => reEsc(esc(t))).sort((a,b)=>b.length-a.length).join("|") + ")", "gi");
  return h.replace(re, "<mark>$1</mark>");
}
function snippet(i, terms){
  const t = DATA.pages[i], low = LOW[i];
  let pos = -1;
  for (const term of terms){ const k = low.indexOf(term); if (k !== -1 && (pos === -1 || k < pos)) pos = k; }
  const start = Math.max(0, pos - 140), end = Math.min(t.length, pos + 260);
  return (start ? "… " : "") + highlight(t.slice(start, end), terms) + (end < t.length ? " …" : "");
}
function pageCard(p, terms, snip){
  return `<div class="card" data-p="${p}">
    <div class="top"><div class="sec">${esc(DATA.sec[p-1] || "Front matter")}</div><div class="pg">Page ${p}</div></div>
    ${snip ? `<div class="snip">${snippet(p-1, terms)}</div>` : ""}
    <div class="btns">
      <a class="btn primary" href="${pdfLink(p)}" target="_blank" rel="noopener">Open page ${p} in PDF</a>
      <button class="btn" data-act="read">Read full page here</button>
    </div>
    <div class="full" hidden></div>
  </div>`;
}
function wireCards(root, terms){
  root.querySelectorAll("[data-act=read]").forEach(b => b.onclick = () => {
    const card = b.closest(".card"), p = +card.dataset.p, full = card.querySelector(".full");
    full.hidden = !full.hidden;
    if (!full.hidden) full.innerHTML = formatPage(p, terms);
    b.textContent = full.hidden ? "Read full page here" : "Hide full page";
  });
}

function runSearch(){
  const q = $("#q").value.trim();
  const r = search(q), box = $("#results");
  if (!r){
    $("#meta").textContent = `${NP} pages indexed. Type a word or phrase, or tap a topic. Press / to jump here.`;
    box.innerHTML = `<div class="empty">Put exact phrases in "quotes". Every word must appear on the page; pages where the words are in a section heading come first.<br><br>"Page N" is the page number your PDF viewer shows, not the small number printed at the foot of each page. Those printed numbers restart in several places.</div>`;
    return;
  }
  const {terms, out} = r;
  $("#meta").textContent = out.length ? `${out.length} page${out.length > 1 ? "s" : ""} match, best first` : "No page contains all of these words. Try fewer or different words.";
  box.innerHTML = out.slice(0, 60).map(({p}) => pageCard(p, terms, true)).join("") + (out.length > 60 ? `<div class="meta">Showing top 60 of ${out.length}. Add another word to narrow down.</div>` : "");
  wireCards(box, terms);
}

// ---------- tabs ----------
function show(tab){
  const ask = tab === "ask", srch = tab === "search", upd = tab === "upd", wiz = tab === "wiz", home = tab === "home";
  $("#tabHome").setAttribute("aria-selected", home);
  $("#homePane").hidden = !home;
  if (home) drawHome();
  $("#tabAsk").setAttribute("aria-selected", ask); $("#tabSearch").setAttribute("aria-selected", srch); $("#tabUpd").setAttribute("aria-selected", upd); $("#tabWiz").setAttribute("aria-selected", wiz);
  $("#wizPane").hidden = !wiz;
  if (wiz) drawWizard();
  $("#askBar").hidden = $("#askPane").hidden = !ask;
  $("#searchBar").hidden = $("#searchPane").hidden = !srch;
  $("#updPane").hidden = !upd;
  if (upd) drawUpdates();
  $("#readPane").hidden = true; curTab = tab;
  if (curSec !== -1){ curSec = -1; drawToc($("#tocFilter").value); }
  if (ask) $("#ask").focus(); else if (srch) $("#q").focus();
  try { localStorage.setItem("rctab", tab); } catch(e) {}
}
$("#tabHome").onclick = () => show("home");
$("#tabAsk").onclick = () => show("ask");
$("#tabSearch").onclick = () => show("search");
$("#tabUpd").onclick = () => show("upd");
$("#tabWiz").onclick = () => show("wiz");

let timer;
$("#q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(runSearch, 150); });
document.addEventListener("keydown", e => { if (e.key === "/" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)){ e.preventDefault(); show("search"); $("#q").select(); } });
$("#chips").innerHTML = QUICK.map(t => `<button class="chip">${esc(t)}</button>`).join("");
$("#chips").onclick = e => { if (e.target.classList.contains("chip")){ $("#q").value = e.target.textContent; runSearch(); } };

let curSec = -1, curTab = "ask";
function drawToc(f){
  f = (f || "").toLowerCase();
  $("#toc").innerHTML = DATA.toc.map((e, i) => [e, i]).filter(([[, t]]) => !f || t.toLowerCase().includes(f))
    .map(([[lv, t, p], i]) => `<div class="trow l${lv}${i === curSec ? " on" : ""}"><button class="tlink" data-i="${i}">${esc(t)}</button><a href="${pdfLink(p)}" target="_blank" rel="noopener" title="Open the original PDF page">p.${p}</a></div>`).join("");
}
$("#tocFilter").addEventListener("input", e => drawToc(e.target.value));
$("#toc").addEventListener("click", e => { const b = e.target.closest(".tlink"); if (b) openSection(+b.dataset.i); });
drawToc();
$("#gloss").innerHTML = GLOSS.map(([a, b]) => `<b>${esc(a)}</b><span>${esc(b)}</span>`).join("");

// ---------- Ask a question (Claude) ----------
const RULES = `You help a regulatory-affairs professional answer questions from their boss or clients about India's CIB&RC "Guidelines for the Registration of Pesticides under the Insecticides Act, 1968 and Rules 1971" (the 472nd RC compilation, ${NP} pages).

Rules:
- Answer ONLY from the guideline pages given to you or returned by the tools. Never use outside knowledge about fees, timelines or rules that the pages do not state.
- If the pages you have do not answer the question, call search_guidelines with other wording (synonyms, abbreviations such as TIM/FIM/FI/TI, 9(3)/9(3B)/9(4), RTT, MUP) and read_page for promising pages. If it is still not found, say plainly that the guidelines do not seem to cover it.
- Cite every fact with the page number in square brackets, like [p.256] or [p.241, p.243]. Page numbers are PDF page numbers as given in the "PAGE n" headers.
- Write for someone who must reply to a client in a minute: first a direct 1-2 sentence answer, then the key points or document checklist as "- " bullets. Keep it under about 250 words unless a checklist needs more. Plain language; expand abbreviations once.
- Formatting: plain text, "- " bullets, **bold** for key terms. No headings, no tables.`;

const turns = [];   // {q, a}
let sample = null, toolsOk = false, ctl = null;

function renderAnswer(text){
  const lines = esc(text).split(/\n/);
  let html = "", inList = false;
  for (let line of lines){
    line = line.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    const m = line.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)/);
    if (m){ if (!inList){ html += "<ul>"; inList = true; } html += `<li>${m[1]}</li>`; continue; }
    if (inList){ html += "</ul>"; inList = false; }
    if (line.trim()) html += `<p>${line}</p>`;
  }
  if (inList) html += "</ul>";
  return html.replace(/\[((?:pp?\.?\s*)?\d[\d\s,;\-–p.and]*)\]/gi, (all, inner) => {
    const nums = [];
    inner.replace(/(\d+)\s*[-–]\s*(\d+)|(\d+)/g, (_, a, b, c) => { if (c) nums.push(+c); else { for (let k = +a; k <= Math.min(+b, +a + 8); k++) nums.push(k); } });
    const ok = nums.filter(n => n >= 1 && n <= NP);
    return ok.length ? ok.map(n => `<a class="cite" href="${pdfLink(n)}" target="_blank" rel="noopener" title="${esc(DATA.sec[n-1] || "")}">p.${n}</a>`).join("") : all;
  });
}
function citedPages(text){
  const s = new Set();
  text.replace(/\[([^\]]*\d[^\]]*)\]/g, (_, inner) => { inner.replace(/\d+/g, n => { n = +n; if (n >= 1 && n <= NP) s.add(n); }); });
  return [...s].sort((a, b) => a - b);
}
function pageBlock(p, max){
  const t = DATA.pages[p-1];
  return `=== PAGE ${p} | section: ${DATA.sec[p-1] || "front matter"} ===\n${t.length > max ? t.slice(0, max) + " …[page continues; call read_page for the rest]" : t}`;
}

const TOOLS = [
  { name: "search_guidelines",
    description: "Keyword search over all pages of the guideline PDF. Returns up to 8 best pages as {page, section, excerpt}. Use different wording or abbreviations if the first search misses.",
    inputSchema: {type: "object", properties: {query: {type: "string", description: "keywords, e.g. 'change of name company endorsement'"}}, required: ["query"]},
    execute(input){
      const q = String(input.query || "");
      setStatus(`Searching the guidelines for “${q}”…`);
      return rank(q, 8).map(p => ({page: p, section: DATA.sec[p-1], excerpt: DATA.pages[p-1].slice(0, 500)}));
    } },
  { name: "read_page",
    description: "Returns the full text of one PDF page (1-" + NP + ") with its section name. Use it to read a page found by search, or the next page when a section continues.",
    inputSchema: {type: "object", properties: {page: {type: "integer"}}, required: ["page"]},
    execute(input){
      const p = Math.round(Number(input.page));
      if (!(p >= 1 && p <= NP)) throw new Error("page must be between 1 and " + NP);
      setStatus(`Reading page ${p}…`);
      return pageBlock(p, 9000);
    } }
];

let statusEl = null;
function setStatus(s){ if (statusEl) statusEl.textContent = s; }

function drawAskIntro(){
  $("#askPane").innerHTML = `<div class="empty">Ask in your own words. Claude reads the relevant guideline pages and answers with page references you can click to open the PDF at that page.<br><br><span class="disclaim">Answers come from the guideline text only. Check the cited page before you quote it formally.</span></div>`;
}

async function ask(qText){
  qText = qText.trim();
  if (!qText || !sample) return;
  if (ctl){ ctl.abort(); }
  if (!turns.length) $("#askPane").innerHTML = "";
  const wrap = document.createElement("div");
  wrap.innerHTML = `<div class="turn-q">${esc(qText)}</div><div class="answer"><div class="status">Finding the relevant pages…</div><div class="body"></div></div><div class="srcs"></div>`;
  $("#askPane").prepend(wrap);
  statusEl = wrap.querySelector(".status");
  const body = wrap.querySelector(".body");
  $("#ask").value = "";
  const btn = $("#askBtn"); btn.textContent = "Stop"; btn.classList.add("stop");
  ctl = new AbortController();
  const myCtl = ctl;

  // seed with the best-matching pages, including the previous question for follow-ups
  const ctxQ = qText + " " + (turns.length ? turns[turns.length - 1].q : "");
  const seed = rank(ctxQ, 6);
  const msgs = [{role: "user", content: RULES + "\n\nHere are the pages that best match the question by keyword (they may or may not be relevant):\n\n" + seed.map(p => pageBlock(p, 3500)).join("\n\n")}];
  for (const t of turns.slice(-3)){ msgs.push({role: "user", content: t.q}); msgs.push({role: "assistant", content: t.a}); }
  msgs.push({role: "user", content: "Question: " + qText});

  let final = "";
  try {
    setStatus("Thinking…");
    const res = await sample(msgs, {
      signal: myCtl.signal, cache: false, modelTier: "default",
      ...(toolsOk ? {tools: TOOLS} : {}),
      onText: ({text}) => { statusEl.textContent = ""; body.innerHTML = renderAnswer(text); final = text; }
    });
    final = res.text;
    body.innerHTML = renderAnswer(final);
    statusEl.textContent = res.truncated ? "The answer was cut short. Ask a narrower question for the rest." : "";
    turns.push({q: qText, a: final});
  } catch (e) {
    const kept = e && e.text;
    if (kept && e.code !== "refused"){ body.innerHTML = renderAnswer(kept); final = kept; } else body.innerHTML = "";
    const msg = {
      cancelled: "Stopped.",
      not_granted: "Claude is not allowed for this page, so only Search pages works here.",
      sampling_disabled: "Claude is not available for this account, so only Search pages works here.",
      rate_limited: "Too many questions in a short time, or your Claude usage limit was reached. Wait a little and ask again.",
      session_expired: "Your Claude session expired. Sign in again, then ask.",
      prompt_too_large: "That question pulled in too much text. Ask something narrower.",
      refused: "Claude could not answer this one. Try rewording it.",
    }[e && e.code] || "Something went wrong reaching Claude. Ask again in a moment.";
    statusEl.textContent = msg;
    statusEl.className = e && e.code === "cancelled" ? "status" : "note";
    if (e && ["not_granted", "sampling_disabled"].includes(e.code)) disableAsk(msg);
  } finally {
    if (ctl === myCtl){ ctl = null; btn.textContent = "Ask"; btn.classList.remove("stop"); }
  }
  const cites = citedPages(final);
  if (cites.length){
    wrap.querySelector(".srcs").innerHTML = `<span class="lbl" style="margin:0;align-self:center">Sources</span>` +
      cites.slice(0, 12).map(p => `<a class="btn" href="${pdfLink(p)}" target="_blank" rel="noopener" title="${esc(DATA.sec[p-1] || "")}">p.${p} · ${esc((DATA.sec[p-1] || "").split(" › ").pop().slice(0, 48))}</a>`).join("");
  }
}

function disableAsk(msg){
  $("#askBtn").disabled = true; $("#ask").disabled = true;
  $("#askPane").innerHTML = `<div class="empty">${esc(msg)}${DATA.onlineUrl ? `<br><br>Open the online version to ask questions: <a href="${esc(DATA.onlineUrl)}" target="_blank" rel="noopener">${esc(DATA.onlineUrl)}</a>` : ""}<br><br>You can still use <b>Search pages</b> and the contents list.</div>`;
}

$("#askBtn").onclick = () => { if (!AI){ askLocal($("#ask").value); return; } if (ctl){ ctl.abort(); return; } ask($("#ask").value); };
$("#ask").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); if (!AI) askLocal($("#ask").value); else if (!ctl) ask($("#ask").value); } });
$("#askChips").innerHTML = ASKS.map(t => `<button class="chip">${esc(t)}</button>`).join("");
$("#askChips").onclick = e => { if (!e.target.classList.contains("chip")) return; if (!AI){ $("#ask").value = e.target.textContent; askLocal(e.target.textContent); } else if (!ctl && sample) ask(e.target.textContent); };


// ---------- smart search: answers questions without AI by showing the best-matching paragraphs ----------
const AI = !!(window.claude && window.claude.use);
function secIndexFor(p){ let k = -1; DATA.toc.forEach((e, i) => { if (e[2] <= p) k = i; }); return k; }
function askLocal(qText){
  qText = qText.trim();
  if (!qText) return;
  const words = qWords(qText);
  const df = words.map(w => LOW.reduce((a, t) => a + (t.includes(w) ? 1 : 0), 0));
  const pages = rank(qText, 6);
  const re = words.length ? new RegExp("(" + words.map(w => reEsc(esc(w))).sort((a, b) => b.length - a.length).join("|") + ")(?![^<]*>)", "gi") : null;
  const cards = pages.map(p => {
    const paras = DATA.pages[p-1].split("\n");
    const scored = paras.map((t, i) => {
      const lt = t.toLowerCase(); let sc = 0;
      words.forEach((w, k) => { if (df[k] && lt.includes(w)) sc += Math.log(1 + NP / df[k]) * (1 + Math.min(count(lt, w), 3) * .3); });
      return {i, sc};
    }).filter(x => x.sc > 0).sort((a, b) => b.sc - a.sc).slice(0, 2).sort((a, b) => a.i - b.i);
    const pick = new Set();
    scored.forEach(x => { pick.add(x.i); if (/:$/.test(paras[x.i].trim()) && x.i + 1 < paras.length) pick.add(x.i + 1); });
    const html = [...pick].sort((a, b) => a - b).map(i => `<p class="rp">${(re ? markImportant(esc(paras[i])).replace(re, "<mark>$1</mark>") : markImportant(esc(paras[i])))}</p>`).join("");
    const si = secIndexFor(p);
    return `<div class="card"><div class="top"><div class="sec">${esc(DATA.sec[p-1] || "Front matter")}</div><div class="pg">Page ${p}</div></div>
      <div class="snip">${html || esc(DATA.pages[p-1].slice(0, 300))}</div>
      <div class="btns"><a class="btn primary" href="${pdfLink(p)}" target="_blank" rel="noopener">Open page ${p}</a>${si >= 0 ? `<button class="btn" data-sec="${si}">Read this section</button>` : ""}</div></div>`;
  });
  $("#askPane").innerHTML = `<div class="turn-q">${esc(qText)}</div>
    <div class="meta">Best-matching passages in the guidelines, most relevant first. Open the page or section to read it in full.</div>
    ${cards.length ? cards.join("") : `<div class="empty">No matching passages. Try other words, e.g. the Act section (9(3), 9(4)) or the category (TIM, FIM).</div>`}`;
  $("#askPane").querySelectorAll("[data-sec]").forEach(b => b.onclick = () => openSection(+b.dataset.sec));
}

// ---------- section reader ----------
function secRange(i){
  const [lv, , start] = DATA.toc[i];
  let end = NP;
  for (let j = i + 1; j < DATA.toc.length; j++){ if (DATA.toc[j][0] <= lv){ end = DATA.toc[j][2] - 1; break; } }
  return [start, Math.max(start, end)];
}
// three kinds of "important": obligations, figures, legal references
const HL = new RegExp([
  "(\\b(?:shall not|shall|must not|must|mandatory|compulsory|not be (?:allowed|permitted|accepted|considered)|not (?:allowed|permitted)|prohibited|at least|not more than|not less than|minimum of|maximum of)\\b)",
  "((?:Rs\\.?|INR|₹)\\s*[\\d,]+(?:\\.\\d+)?(?:\\/-)?|\\b\\d+(?:\\.\\d+)?\\s*(?:working days|days|months|month|years|year|weeks|week|hours|%|per ?cent|kg|mg|ml|litres?|ha|hectares?|ppm|°C|℃|g\\/kg|g\\/l)(?![a-z]))",
  "((?:u\\/s\\.?\\s*|[Ss]ection\\s*)?\\b9\\s*\\(\\s*(?:3B|3b|3|4)\\s*\\)|\\bForm[- ]?(?:[IVX]{1,4}|\\d{1,2})\\b|\\bAnnexure[- ]?[IVX\\d][\\w.]*|\\b[Rr]ule\\s+\\d+\\b|\\bSection\\s+\\d+[A-Z]?\\b)"
].join("|"), "g");
function markImportant(h){
  return h.replace(HL, (m, a, b) => a ? `<span class="hl-must">${m}</span>` : b ? `<span class="hl-num">${m}</span>` : `<span class="hl-ref">${m}</span>`);
}
function formatPage(p, terms){
  terms = terms || [];
  const termRe = terms.length ? new RegExp("(" + terms.map(x => reEsc(esc(x))).sort((a, b) => b.length - a.length).join("|") + ")(?![^<]*>)", "gi") : null;
  return DATA.pages[p-1].split("\n").map(line => {
    let cls = "rp";
    const t = line.trim();
    if (/^(?:\d{1,2}(?:\.\d{1,2})*[.)]|\(?[ivx]{1,4}[.)]|\(?[a-hj-z][.)]|[•●▪◦\-–])\s*\S/i.test(t)) cls += " li";
    else if (t.length <= 110 && (/^(?:sub ?-?category|category|annexure|part|chapter|note)\b/i.test(t) || (/^[^a-z]{8,}$/.test(t) && /[A-Z]{4}/.test(t)) || /:$/.test(t))) cls += " h";
    let h = markImportant(esc(t));
    if (termRe) h = h.replace(termRe, "<mark>$1</mark>");
    return `<p class="${cls}">${h}</p>`;
  }).join("");
}
function sectionText(a, b, cap){
  let out = "", cut = false;
  for (let p = a; p <= b; p++){
    const blk = `=== PAGE ${p} ===\n${DATA.pages[p-1]}\n\n`;
    if (out.length + blk.length > cap){ cut = p; break; }
    out += blk;
  }
  return {text: out, cut};
}

async function keyPoints(i, a, b){
  if (!sample) return;
  const box = $("#kp"), btn = $("#rKey");
  box.hidden = false; btn.disabled = true;
  box.innerHTML = `<div class="kpc"><div class="kp-load"><span class="spin" aria-hidden="true"></span>Claude is reading pages ${a}${b > a ? "–" + b : ""} and picking out what matters…</div></div>`;
  box.scrollIntoView({block: "nearest"});
  const {text, cut} = sectionText(a, b, 140000);
  const prompt = `You summarise one section of India's CIB&RC "Guidelines for the Registration of Pesticides under the Insecticides Act, 1968" for a regulatory-affairs professional who must brief their boss or a client in one minute.

Section: "${DATA.toc[i][1]}", PDF pages ${a}-${b}.${cut ? ` Only pages ${a}-${cut - 1} are included because the section is long.` : ""}

Rules:
- Use ONLY this text. Do not add outside knowledge.
- Plain, short English. Each point at most 22 words. Expand an abbreviation the first time (e.g. "TIM (Technical Indigenous Manufacture)").
- "page" is the PDF page number from the "=== PAGE n ===" markers where the point appears.
- "quote" is 5-10 consecutive words copied EXACTLY from that page's text, so the point can be found in the text.
- "mustKnow": the 2-4 most critical points: hard deadlines, conditions that make a certificate invalid, things that cause rejection, things people often miss.
- "numbers": every important figure: time limits, validity, quantities, percentages, fees, number of seasons/locations. "value" is the figure with its unit (e.g. "30 months"); "label" says what it is in a few words.
- "groups": the rest of the content in 2-5 groups with clear titles such as "Documents to submit", "Data required", "Conditions", "Not allowed", "Process". At most 16 points in all groups together. Do not repeat mustKnow points.

Reply with only this JSON:
{"oneLine":"what this section is for, one sentence","appliesTo":["who it applies to, 2-6 short chips"],"mustKnow":[{"text":"","page":${a},"quote":""}],"numbers":[{"value":"","label":"","page":${a}}],"groups":[{"title":"","points":[{"text":"","page":${a},"quote":""}]}]}

${text}`;
  try {
    const out = await sample.json(prompt, {cache: {gcTime: 86400000}});
    const kp = cleanKp(out, a, b);
    if (!kp.oneLine && !kp.groups.length && !kp.mustKnow.length) throw {code: "empty"};
    renderKp(kp, i, a, b);
  } catch(e){
    box.innerHTML = `<div class="kpc"><div class="note">${esc({not_granted: "Claude is not allowed for this page.", rate_limited: "Too many requests just now. Try again in a little while.", prompt_too_large: "This section is too long to summarize at once. Pick a smaller part from the contents."}[e && e.code] || "Could not get key points. Try again in a moment.")}</div></div>`;
  } finally { btn.disabled = false; }
}
function cleanKp(o, a, b){
  const pg = n => { n = Math.round(Number(n)); return n >= a && n <= b ? n : a; };
  const str = v => String(v == null ? "" : v).trim();
  const pts = arr => (Array.isArray(arr) ? arr : []).map(p => ({text: str(p.text), page: pg(p.page), quote: str(p.quote)})).filter(p => p.text);
  return {
    oneLine: str(o && o.oneLine),
    appliesTo: (Array.isArray(o && o.appliesTo) ? o.appliesTo : []).map(str).filter(Boolean).slice(0, 6),
    mustKnow: pts(o && o.mustKnow).slice(0, 4),
    numbers: (Array.isArray(o && o.numbers) ? o.numbers : []).map(n => ({value: str(n.value), label: str(n.label), page: pg(n.page)})).filter(n => n.value).slice(0, 8),
    groups: (Array.isArray(o && o.groups) ? o.groups : []).map(g => ({title: str(g.title) || "Points", points: pts(g.points)})).filter(g => g.points.length),
  };
}
// find the paragraph a point came from, so "Show in text" can jump to it
const normTxt = s => s.toLowerCase().replace(/[^a-z0-9%()]+/g, " ").trim();
function findPara(pt){
  const art = document.querySelector(`#readPane .rpage[data-p="${pt.page}"]`);
  if (!art) return null;
  const paras = [...art.querySelectorAll("p.rp")];
  const q = normTxt(pt.quote || "");
  if (q){
    let hit = paras.find(p => normTxt(p.textContent).includes(q));
    if (!hit){ const w = q.split(" "); for (let n = Math.min(6, w.length); n >= 4 && !hit; n--){ const part = w.slice(0, n).join(" "); hit = paras.find(p => normTxt(p.textContent).includes(part)); } }
    if (hit) return hit;
  }
  // fall back to the paragraph sharing the most words with the point
  const words = normTxt(pt.text).split(" ").filter(w => w.length > 3);
  let best = null, bestN = 2;
  for (const p of paras){ const t = normTxt(p.textContent); const n = words.filter(w => t.includes(w)).length; if (n > bestN){ best = p; bestN = n; } }
  return best || art;
}
function renderKp(kp, i, a, b){
  const box = $("#kp");
  const all = [...kp.mustKnow.map(p => ({...p, must: true})), ...kp.groups.flatMap(g => g.points)];
  let n = 0;
  const pointHtml = (p, must) => {
    const k = n++;
    return `<li class="kpi${must ? " must" : ""}" data-k="${k}">${must ? `<span class="kp-ic warn" aria-hidden="true">!</span>` : `<span class="kp-ic" aria-hidden="true">${icon("check", 14)}</span>`}<span class="kp-tx">${markImportant(esc(p.text))} <span class="kp-meta"><a class="pgl" href="${pdfLink(p.page)}">p.${p.page}</a> · <button class="linkbtn kp-show" data-k="${k}">Show in text</button></span></span></li>`;
  };
  box.innerHTML = `<div class="kpc">
    <div class="kp-top"><div><div class="eyebrow">Key points · made by Claude from pages ${a}${b > a ? "–" + b : ""}</div>
      ${kp.oneLine ? `<p class="kp-one">${markImportant(esc(kp.oneLine))}</p>` : ""}
      ${kp.appliesTo.length ? `<div class="kp-chips"><span class="sec">Applies to:</span> ${kp.appliesTo.map(t => `<span class="pill">${esc(t)}</span>`).join("")}</div>` : ""}</div>
      <div class="btns" style="margin:0"><button class="btn" id="kpCopy">Copy</button><a class="btn" id="kpWa" target="_blank" rel="noopener">WhatsApp ↗</a><button class="btn" id="kpHide">Hide</button></div>
    </div>
    ${kp.mustKnow.length ? `<div class="kp-must"><div class="kp-h">Must know</div><ul>${kp.mustKnow.map(p => pointHtml(p, true)).join("")}</ul></div>` : ""}
    ${kp.numbers.length ? `<div class="kp-h">Key numbers</div><div class="kp-nums">${kp.numbers.map(x => `<a class="kp-num" href="${pdfLink(x.page)}"><b>${esc(x.value)}</b><span>${esc(x.label)}</span><small>p.${x.page}</small></a>`).join("")}</div>` : ""}
    ${kp.groups.map(g => `<div class="kp-h">${esc(g.title)}</div><ul class="kp-list">${g.points.map(p => pointHtml(p, false)).join("")}</ul>`).join("")}
    <div class="disclaim">Check the cited page before quoting formally. Highlighted paragraphs in the text below are where these points come from.</div>
    <div class="note" id="kpMsg" aria-live="polite"></div>
  </div>`;
  // mark the source paragraphs in the section text
  document.querySelectorAll("#readPane p.kp-src").forEach(p => { p.classList.remove("kp-src"); p.removeAttribute("data-kpn"); });
  const targets = all.map(findPara);
  targets.forEach((el, k) => { if (el && el.tagName === "P"){ el.classList.add("kp-src"); if (all[k].must) el.classList.add("kp-src-must"); el.dataset.kpn = (el.dataset.kpn ? el.dataset.kpn + "," : "") + (k + 1); } });
  box.querySelectorAll(".kp-show").forEach(btn => btn.onclick = () => {
    const el = targets[+btn.dataset.k];
    if (!el) return;
    el.scrollIntoView({block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
    el.classList.remove("kp-flash"); void el.offsetWidth; el.classList.add("kp-flash");
  });
  const txt = kpText(kp, i, a, b);
  $("#kpCopy").onclick = () => copyText(txt, $("#kpMsg"));
  $("#kpWa").href = "https://wa.me/?text=" + encodeURIComponent(txt.slice(0, 3500));
  $("#kpHide").onclick = () => { box.hidden = true; };
}
function kpText(kp, i, a, b){
  let t = `${DATA.toc[i][1]} (CIB&RC guidelines, PDF p.${a}${b > a ? "-" + b : ""})\n`;
  if (kp.oneLine) t += `\n${kp.oneLine}\n`;
  if (kp.appliesTo.length) t += `Applies to: ${kp.appliesTo.join(", ")}\n`;
  if (kp.mustKnow.length) t += `\nMUST KNOW\n` + kp.mustKnow.map(p => `! ${p.text} (p.${p.page})`).join("\n") + "\n";
  if (kp.numbers.length) t += `\nKEY NUMBERS\n` + kp.numbers.map(x => `- ${x.value}: ${x.label} (p.${x.page})`).join("\n") + "\n";
  for (const g of kp.groups) t += `\n${g.title.toUpperCase()}\n` + g.points.map(p => `- ${p.text} (p.${p.page})`).join("\n") + "\n";
  return t;
}

function statusFor(vals, cols, key){
  const i = cols.findIndex(c => Array.isArray(c) ? c.includes(key) : c === key);
  return i === -1 ? null : vals[i];
}
const isReq = s => s && /^R/.test(s);
function buildChemList(type, cat, sit){
  const key = `${type}-${cat}`;
  const groups = [];
  const legal = LEGAL.filter(r => !r[3] || r[3].includes(key)).concat(type === "4" ? LEGAL_94.filter(r => r[3].includes(key)) : []);
  groups.push({name: "Legal documents", pages: [74, 75], items: legal.map((r, i) => ({id: `legal-${i}`, text: r[1], page: r[0], st: "R", note: r[2] === "kyc" ? "Not needed again if your KYC is active on CROP" : ""})),
    notes: [[75, "If KYC is active on the CROP portal, the documents marked KYC need not be submitted again."]]});
  groups.push({name: "Chemistry", pages: [76, 78], items: CHEM.map((r, i) => ({id: `chem-${i + 1}`, n: i + 1, text: r[1], page: r[0], st: statusFor(r[2], CHEM_COLS, key)})), notes: CHEM_NOTES});
  if (type === "4"){
    groups.push({name: "Bio-efficacy", pages: [79, 79], items: [], notes: [[79, "9(4) TI / TIM / FI / FIM: no bio-efficacy data. The label claim is granted as per the approved 9(3) formulation or approved label expansion."]]});
  } else {
    groups.push({name: "Bio-efficacy", pages: [79, 82], items: BIO.map((r, i) => ({id: `bio-${i + 1}`, n: i + 1, text: r[1], page: r[0], st: statusFor(r[2], BIO_COLS, key)})), notes: BIO_NOTES});
  }
  const sitDef = (SITUATIONS[key] || []).find(s => s[0] === sit);
  let tox = TOX.map((r, i) => ({id: `tox-${i + 1}`, n: i + 1, text: r[1], page: r[0], st: statusFor(r[2], TOX_COLS, key)}));
  const toxNotes = TOX_NOTES.slice();
  if (sitDef){
    toxNotes.unshift([sitDef[4], "For your case: " + sitDef[2]]);
    if (sitDef[3]) tox = tox.map(it => ({...it, st: sitDef[3].includes(it.n) ? (isReq(it.st) ? it.st : "R") : "NR", over: true}));
  }
  groups.push({name: "Toxicology", pages: [83, 88], items: tox, notes: toxNotes});
  groups.push({name: "Packaging and labelling", pages: [89, 89], items: PACK.map((r, i) => ({id: `pack-${i + 1}`, n: i + 1, text: r[1], page: r[0], st: statusFor(r[2], PACK_COLS, key)})), notes: PACK_NOTES});
  const rel = [...(RELATED[key] || []), ...(RELATED[type] || []), ...RELATED.all];
  const title = `${TYPE_INFO[type][0]} · ${cat} (${CAT_INFO[cat][1]})${sitDef ? " · " + sitDef[1] : ""}`;
  return {kind: "chem", key: [type, cat, sit || ""].join("|"), title, groups, related: rel, caseNote: sitDef ? [sitDef[4], sitDef[2]] : null};
}

function wireWizard(){
  const p = wzPane();
  p.querySelectorAll("[data-wgo]").forEach(b => b.onclick = () => { WZ.step = b.dataset.wgo; drawWizard(); });
  p.querySelectorAll("[data-route]").forEach(b => b.onclick = () => { WZ.route = b.dataset.route; WZ.step = WZ.route === "chem" ? "type" : "route"; drawWizard(); });
  p.querySelectorAll("[data-type]").forEach(b => b.onclick = () => { WZ.type = b.dataset.type; WZ.step = "cat"; drawWizard(); });
  p.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => {
    WZ.cat = b.dataset.cat;
    if (SITUATIONS[`${WZ.type}-${WZ.cat}`] && SITUATIONS[`${WZ.type}-${WZ.cat}`].length > 1){ WZ.step = "sit"; drawWizard(); }
    else openList(buildChemList(WZ.type, WZ.cat, (SITUATIONS[`${WZ.type}-${WZ.cat}`] || [[null]])[0][0]));
  });
  p.querySelectorAll("[data-sit]").forEach(b => b.onclick = () => openList(buildChemList(WZ.type, WZ.cat, b.dataset.sit)));
  p.querySelectorAll("[data-read]").forEach(b => b.onclick = () => openSection(+b.dataset.read));
  p.querySelectorAll("[data-make]").forEach(b => b.onclick = () => makeAiList(+b.dataset.make, b));
  p.querySelectorAll("[data-open]").forEach(b => b.onclick = () => openSaved(b.dataset.open));
}

      <div class="items">${r.map(it => `<label class="item"><input type="checkbox" data-tick="${it.id}"${WZ.ticks[it.id] ? " checked" : ""}><span class="itx">${it.n ? `<span class="num">${it.n}.</span> ` : ""}${markImportant(esc(it.text))}${it.note ? `<small class="sec"> · ${esc(it.note)}</small>` : ""}</span><span class="stc ${it.st === "R" ? "" : "cond"}" title="${esc(stTip(it.st))}">${esc(stLabel(it.st))}</span><a class="pgl" href="${pdfLink(it.page)}">p.${it.page}</a></label>`).join("")}
      ${WZ.showNR && nr.length ? nr.map(it => `<div class="item nr"><span></span><span class="itx">${it.n ? `<span class="num">${it.n}.</span> ` : ""}${esc(it.text)}</span><span class="stc nrc">${esc(it.st || "NR")}</span><a class="pgl" href="${pdfLink(it.page)}">p.${it.page}</a></div>`).join("") : ""}</div>
      ${g.notes && g.notes.length ? `<div class="gnotes">${g.notes.map(n => `<p>${markImportant(esc(n[1]))} <a class="pgl" href="${pdfLink(n[0])}">p.${n[0]}</a></p>`).join("")}</div>` : ""}
    </details>`;
  }
  if (L.related && L.related.length){
    html += `<div class="lbl" style="margin-top:16px">Also read</div><div class="srcs">${L.related.map(r => `<button class="btn" data-relp="${r[0]}">${esc(r[1])} · p.${r[0]}</button>`).join("")}</div>`;
  }
  html += `<div class="lbl" style="margin-top:16px">Notes</div><textarea id="wzNotes" class="wznotes" placeholder="Your own notes for this application (saved with the checklist)">${esc(WZ.notes || "")}</textarea>`;
  p.innerHTML = html;
  wireWizard();
  p.querySelectorAll("[data-tick]").forEach(cb => cb.onchange = () => { WZ.ticks[cb.dataset.tick] = cb.checked; if (!cb.checked) delete WZ.ticks[cb.dataset.tick]; drawChecklist(); persist(); });
  p.querySelectorAll("[data-relp]").forEach(b => b.onclick = () => { const p0 = +b.dataset.relp; const i = DATA.toc.findIndex(e => e[2] === p0); i >= 0 ? openSection(i) : openViewer(p0); });

  if ($("#wzSave")) $("#wzSave").onclick = saveList;
  if ($("#wzDel")) $("#wzDel").onclick = delList;
}
function checklistText(){
  const L = WZ.list;
  let t = `${L.title}\n(Guidelines for the Registration of Pesticides, 472 RC compilation; page numbers are PDF pages)\n`;
  for (const g of L.groups){
    const r = g.items.filter(it => isReq(it.st));
    t += `\n${g.name.toUpperCase()} (p.${g.pages[0]}${g.pages[1] > g.pages[0] ? "-" + g.pages[1] : ""})\n`;
    if (!r.length) t += (g.notes && g.notes[0] ? "- " + g.notes[0][1] : "- Nothing required") + "\n";
    for (const it of r) t += `${WZ.ticks[it.id] ? "[x]" : "[ ]"} ${it.text}${it.st !== "R" ? ` (${it.st})` : ""} - p.${it.page}\n`;
  }
  if (WZ.notes) t += `\nNotes: ${WZ.notes}\n`;
  return t;
}
async function copyText(t, msg){
  try { await navigator.clipboard.writeText(t); msg.textContent = "Copied. Paste it into email or chat."; }
  catch(e){
    const ta = document.createElement("textarea"); ta.value = t; ta.className = "wznotes"; msg.textContent = "Select all and copy:"; msg.after(ta); ta.select();

}

// AI checklist for the other guideline sections
async function makeAiList(i, btn){
  if (!sample) return;
  const [a, b] = secRange(i);
  btn.disabled = true; const old = btn.textContent; btn.textContent = "Reading the guideline…";
  const {text, cut} = sectionText(a, b, 120000);
  const prompt = `From this section of India's CIB&RC "Guidelines for the Registration of Pesticides" ("${DATA.toc[i][1]}", PDF pages ${a}-${b}), list every data item and document an applicant must submit, as a checklist. Use only this text. Group items under short group names (e.g. "Legal documents", "Chemistry", "Bio-efficacy", "Toxicology", "Packaging"; use the section's own groups when it has them). Keep each item short and in plain language. For each item give the PDF page where it appears (from the "=== PAGE n ===" markers). Mark an item "R" if required, or a short condition like "If claimed" if it is conditional.${cut ? ` Only pages ${a}-${cut - 1} are included.` : ""}

Reply with only JSON: {"groups":[{"name":"Chemistry","items":[{"text":"Method of analysis","page":${a},"st":"R"}]}]}

${text}`;
  try {
    const out = await sample.json(prompt, {cache: {gcTime: 86400000}});
    const groups = (out && Array.isArray(out.groups) ? out.groups : []).map((g, gi) => ({
      name: String(g.name || "Items"), pages: [a, b], notes: [],
      items: (Array.isArray(g.items) ? g.items : []).map((it, k) => {
        const pg = Math.round(Number(it.page)); const st = String(it.st || "R");
        return {id: `ai-${gi}-${k}`, text: String(it.text || ""), page: pg >= a && pg <= b ? pg : a, st: /^r$/i.test(st) ? "R" : "R (" + st + ")"};
      }).filter(it => it.text)
    })).filter(g => g.items.length);
    if (!groups.length) throw {code: "empty"};
    openList({kind: "ai", key: "sec|" + i, title: DATA.toc[i][1], groups, related: [[a, "Read the full section"]]});
  } catch(e){
    btn.textContent = e && e.code === "rate_limited" ? "Too many requests; try later" : "Could not make it; try again";
    setTimeout(() => { btn.textContent = old; btn.disabled = false; }, 4000);
    return;
  }
}

// ---------- in-page PDF viewer (online version: the PDF is only reachable from inside this page) ----------
const V = {doc: null, loading: null, page: 1, zoom: 1, textMode: false, renderTask: null};
function loadScript(src){
  return new Promise((ok, bad) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => bad(new Error("script")); document.head.appendChild(s); });
}
function loadPdf(){
  if (V.loading) return V.loading;
  V.loading = (async () => {
    const base = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
    await loadScript(base + "pdf.min.js");
    await loadScript(base + "pdf.worker.min.js");   // runs pdf.js on the page itself; the frame blocks outside workers
    const buf = await (await fetch(DATA.pdfUrl)).arrayBuffer();
    V.doc = await window.pdfjsLib.getDocument({data: new Uint8Array(buf)}).promise;
    return V.doc;
  })();
  V.loading.catch(() => { V.loading = null; });
  return V.loading;
}
async function renderPage(){
  const p = V.page, body = $("#vBody");
  $("#vPage").value = p; $("#vTotal").textContent = NP;
  $("#vSec").textContent = DATA.sec[p-1] || "";
  $("#vText").textContent = V.textMode ? "Show page image" : "Show text";
  if (V.textMode || !V.doc){
    if (V.textMode) body.innerHTML = `<div class="full" style="max-width:80ch;max-height:none;width:100%">${esc(DATA.pages[p-1])}</div>`;
    return;
  }
  const page = await V.doc.getPage(p);
  if (p !== V.page || V.textMode) return;
  const fit = Math.min(body.clientWidth - 32, 900) / page.getViewport({scale: 1}).width;
  const vp = page.getViewport({scale: fit * V.zoom});
  const dpr = window.devicePixelRatio || 1;
  const c = document.createElement("canvas");
  c.width = Math.floor(vp.width * dpr); c.height = Math.floor(vp.height * dpr);
  c.style.width = Math.floor(vp.width) + "px"; c.style.height = Math.floor(vp.height) + "px";
  if (V.renderTask) V.renderTask.cancel();
  V.renderTask = page.render({canvasContext: c.getContext("2d"), viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null});
  try { await V.renderTask.promise; } catch(e) { return; }
  if (p !== V.page || V.textMode) return;
  body.innerHTML = ""; body.appendChild(c); body.scrollTop = 0;
}
async function openViewer(p){
  V.page = Math.min(NP, Math.max(1, p));
  $("#viewer").hidden = false; document.body.style.overflow = "hidden";
  if (!V.doc && !V.textMode){
    $("#vBody").innerHTML = `<div class="vmsg">Opening the guideline PDF (7.6 MB, first time only)…</div>`;
    renderPage();
    try { await loadPdf(); }
    catch(e){ V.textMode = true; $("#vBody").innerHTML = ""; renderPage(); $("#vSec").textContent = "The PDF image could not load, so this shows the page text. " + (DATA.sec[V.page-1] || ""); return; }
  }
  renderPage();
}
function closeViewer(){ $("#viewer").hidden = true; document.body.style.overflow = ""; }
const go = d => { V.page = Math.min(NP, Math.max(1, V.page + d)); renderPage(); };
$("#vClose").onclick = closeViewer;
$("#vPrev").onclick = () => go(-1);
$("#vNext").onclick = () => go(1);
$("#vIn").onclick = () => { V.zoom = Math.min(3, V.zoom * 1.25); renderPage(); };
$("#vOut").onclick = () => { V.zoom = Math.max(.5, V.zoom / 1.25); renderPage(); };
$("#vText").onclick = () => { V.textMode = !V.textMode; if (!V.textMode && !V.doc) openViewer(V.page); else renderPage(); };
$("#vPage").addEventListener("change", e => { const n = parseInt(e.target.value, 10); if (n) { V.page = Math.min(NP, Math.max(1, n)); renderPage(); } });
document.addEventListener("keydown", e => {
  if ($("#viewer").hidden || e.target.tagName === "INPUT") return;
  if (e.key === "Escape") closeViewer();
  else if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
});

    openViewer(parseInt(a.getAttribute("href").split("#page=")[1], 10));
  });
}
