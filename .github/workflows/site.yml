name: Publish site

# Publishes the website whenever files change. The CIB&RC site blocks GitHub's servers (HTTP 403),
# so checking for new notices runs on the user's own computer, which pushes updates.json here.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

# Two jobs, as in GitHub's own Pages template: deploying in the same job as the upload sometimes
# fails with "No artifacts named github-pages were found" before the upload is visible.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
